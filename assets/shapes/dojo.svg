<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="DOJO glass shape — ring">
  <defs>
    <radialGradient id="dj-fill" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"  stop-color="var(--brand-soft, #F9E590)" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="var(--brand, #FBD947)"      stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--brand-deep, #D4A800)" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="dj-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Ring (torus seen front): outer circle + inner hole -->
  <path d="M 120 20 A 100 100 0 1 0 120 220 A 100 100 0 1 0 120 20 Z
           M 120 70 A 50 50 0 1 1 120 170 A 50 50 0 1 1 120 70 Z"
        fill="url(#dj-fill)" fill-rule="evenodd"/>
  <path d="M 120 20 A 100 100 0 1 0 120 220 A 100 100 0 1 0 120 20 Z
           M 120 70 A 50 50 0 1 1 120 170 A 50 50 0 1 1 120 70 Z"
        fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill-rule="evenodd"/>
  <path d="M 120 20 A 100 100 0 0 1 220 120 Q 200 100 170 100 Q 140 100 120 70 A 50 50 0 0 0 70 100 Q 60 90 30 95 A 100 100 0 0 1 120 20 Z"
        fill="url(#dj-hl)" opacity="0.7"/>
</svg>
