<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="MAINDSET glass shape — M wave">
  <defs>
    <linearGradient id="md-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="var(--brand-soft, #D8B6FA)" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="var(--brand, #9B5BFA)"      stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--brand-deep, #6B22D2)" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="md-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- M-wave: tube curving up-down-up-down (M shape) with rounded ends -->
  <path d="M 30 200
           Q 30 215 45 215
           Q 60 215 60 200
           L 60 90
           Q 60 60 90 60
           Q 120 60 120 90
           L 120 180
           Q 120 200 135 200
           Q 150 200 150 180
           L 150 90
           Q 150 60 180 60
           Q 210 60 210 90
           L 210 200
           Q 210 215 195 215
           Q 180 215 180 200
           L 180 105
           Q 180 90 165 90
           Q 150 90 150 105
           L 150 180
           Q 150 215 135 215
           Q 120 215 120 180
           L 120 105
           Q 120 90 105 90
           Q 90 90 90 105
           L 90 200
           Q 90 215 75 215
           Q 60 215 60 200 Z"
        fill="url(#md-fill)" fill-rule="evenodd"/>
  <!-- Simplified outer outline as highlight -->
  <path d="M 30 90 Q 30 60 60 60 Q 90 60 90 90 L 90 130 Q 60 130 30 130 Z"
        fill="url(#md-hl)" opacity="0.6"/>
  <path d="M 150 90 Q 150 60 180 60 Q 210 60 210 90 L 210 130 Q 180 130 150 130 Z"
        fill="url(#md-hl)" opacity="0.6"/>
</svg>
