        fill="none" stroke="url(#cs-rim)" stroke-width="1.6" fill-rule="evenodd"/>
  <path d="M 50 30 L 190 30 Q 210 30 210 50 L 210 110 Q 180 100 120 110 Q 60 120 30 100 L 30 50 Q 30 30 50 30 Z"
