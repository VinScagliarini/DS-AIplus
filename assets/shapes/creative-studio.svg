<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="CREATIVE STUDIO glass shape — square frame">
  <defs>
    <linearGradient id="cs-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="var(--brand-soft, #F0BEF7)" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="var(--brand, #D464F0)"      stop-opacity="0.85"/>
      <stop offset="100%" stop-color="var(--brand-deep, #B331E0)" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cs-hl" x1="0" y1="0" x2="0" y2="1">
