           A 90 90 0 1 1 115 25 Z
           M 115 75
           A 40 40 0 1 0 115 155
           A 40 40 0 1 0 115 75 Z"
        fill="url(#cl-fill)" fill-rule="evenodd"/>
  <path d="M 115 25
           A 90 90 0 0 1 205 115
           Q 175 90 130 95
           A 40 40 0 0 0 90 100
           Q 60 90 30 110
           A 90 90 0 0 1 115 25 Z"
        fill="url(#cl-hl)" opacity="0.7"/>
  <path d="M 115 25
           A 90 90 0 1 0 115 205
           A 90 90 0 0 0 199 142
           L 215 175
           Q 222 190 207 198
           Q 192 206 184 191
           L 165 158
           A 90 90 0 0 0 115 205
           M 115 75
           A 40 40 0 1 0 115 155
           A 40 40 0 1 0 115 75 Z"
        fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
</svg>
