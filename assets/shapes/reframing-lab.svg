<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="CHANGELAB glass shape — Q curve">
  <defs>
    <linearGradient id="cl-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="var(--brand-soft, #A8C8F7)" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="var(--brand, #3D7BE0)"      stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--brand-deep, #1B49A6)" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cl-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Q shape: circle (hollow) + asymmetric tail bottom-right -->
  <path d="M 115 25
